<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Painel interno da brigadeiraria: insumos, fichas técnicas, precificação, orçamentos e estoque.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --cacau:#3B2418; --cacau-2:#5A3A26; --creme:#FBF3E7; --creme-2:#F3E4CF;
  --doce:#C8506B; --doce-soft:#F6DCE3; --verde:#3F7D5C; --amarelo:#E0A63C;
  --linha:#E4D2BA; --texto:#3B2418; --muted:#8A705C; --branco:#fff;
  --radius:14px; --sombra:0 2px 10px rgba(59,36,24,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--texto);font-family:Karla,system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
a{color:var(--doce)}
header{background:var(--cacau);color:var(--creme);padding:14px 18px;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
header h1{font-size:20px;letter-spacing:.3px}
header .tag{font-size:12px;color:#D9BFA6}
nav{background:var(--cacau-2);position:sticky;top:52px;z-index:19;overflow-x:auto}
nav .inner{display:flex;gap:2px;max-width:1200px;margin:0 auto;padding:0 10px}
nav button{background:none;border:0;color:#EBD9C4;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:var(--doce)}
main{max-width:1200px;margin:0 auto;padding:18px 14px 80px}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:var(--radius);padding:16px;box-shadow:var(--sombra);margin-bottom:16px}
.card h2{font-size:19px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--linha);border-radius:10px;background:#fff;color:var(--texto);min-width:0}
input:focus,select:focus{outline:2px solid var(--doce-soft);border-color:var(--doce)}
.grow{flex:1;min-width:180px}
button.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--cacau);color:#fff}
button.btn.sec{background:var(--doce-soft);color:var(--cacau)}
button.btn.ghost{background:transparent;color:var(--cacau);border:1px solid var(--linha)}
button.btn.dang{background:#fff;color:#B23A48;border:1px solid #EBC3C9}
button.btn:hover{filter:brightness(1.08)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 6px;border-bottom:2px solid var(--linha);cursor:pointer;white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid #F0E6D8;vertical-align:middle}
tr:hover td{background:#FDF8F0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{overflow-x:auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{background:var(--creme-2);border-radius:12px;padding:12px 14px}
.kpi .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-family:Fraunces;font-size:24px;font-weight:700;margin-top:2px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--doce-soft);color:var(--doce)}
.pill.v{background:#DFF0E6;color:var(--verde)}
.pill.a{background:#FBEBD0;color:#9A6B14}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.field{margin-bottom:10px}
.field input,.field select{width:100%}
dialog{border:0;border-radius:16px;padding:0;max-width:640px;width:94%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(59,36,24,.45)}
.dlg{padding:18px}
.dlg h3{font-size:18px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.row select{flex:2}.row input{flex:1}
.muted{color:var(--muted)}
.right{text-align:right}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--cacau);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1}
.locgroup{border:1px solid var(--linha);border-radius:12px;margin-bottom:10px;overflow:hidden}
.locgroup summary{cursor:pointer;padding:10px 14px;background:var(--creme-2);font-weight:700}
.locgroup ul{margin:0;padding:10px 14px 12px 30px}
.locgroup li{padding:3px 0}
#gate{position:fixed;inset:0;background:var(--creme);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
#gate .box{background:#fff;border:1px solid var(--linha);border-radius:18px;box-shadow:var(--sombra);max-width:420px;width:100%;padding:28px;text-align:center}
#gate h2{font-size:24px;margin-bottom:6px}
#gate p{color:var(--muted);font-size:14px;line-height:1.5}
#gate .gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--linha);border-radius:999px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;color:var(--texto);margin-top:16px}
#gate .gbtn:hover{background:var(--creme-2)}
#gate .erro{background:#FDEEF0;color:#B23A48;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px;text-align:left}
.sync{font-size:12px;color:#D9BFA6;display:inline-flex;align-items:center;gap:6px}
.sync b{width:8px;height:8px;border-radius:50%;background:#8ED0A8;display:inline-block}
.sync.wait b{background:var(--amarelo)}
.sync.err b{background:#E58A96}
.verlist{display:flex;flex-direction:column;gap:8px}
.ver{border:1px solid var(--linha);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ver .quando{font-weight:700}
.ver .quem{font-size:12px;color:var(--muted)}
@media print{header,nav,.noprint{display:none!important}main{padding:0}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<header><div class="hrow">
  <h1>🍫 Brigadeiraria</h1>
  <span class="tag" id="hdrInfo">carregando…</span>
  <span class="sync noprint" id="sync" hidden><b></b><span id="syncTxt"></span></span>
  <span style="flex:1"></span>
  <span class="tag noprint" id="userChip"></span>
  <button class="btn sec noprint" id="btnInstalar" hidden onclick="instalarApp()">Instalar app</button>
  <button class="btn sec noprint" onclick="salvarAgora()">Salvar agora</button>
  <button class="btn sec noprint" onclick="exportJSON()">Exportar JSON</button>
  <button class="btn sec noprint" onclick="exportXLSX()">Exportar Excel</button>
  <button class="btn ghost noprint" style="color:#EBD9C4;border-color:#6b4a34" onclick="sair()">Sair</button>
</div></header>
<nav><div class="inner" id="tabs"></div></nav>
<main id="view"></main>
<div id="toast"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="gate"><div class="box">
  <h2>🍫 Brigadeiraria</h2>
  <p>Painel interno. Entre com a conta Google autorizada para carregar os dados do Google Drive.</p>
  <button class="gbtn" id="btnLogin" onclick="entrar()">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.7l7.8 6.1C12.3 13.7 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-2.8-.4-4.1H24v7.8h12.6c-.3 2.1-1.6 5.2-4.7 7.3l7.6 5.9c4.5-4.2 6.6-10.3 6.6-16.9z"/><path fill="#FBBC05" d="M10.4 28.2a14.5 14.5 0 0 1 0-8.4l-7.8-6.1a24 24 0 0 0 0 20.6l7.8-6.1z"/><path fill="#34A853" d="M24 47.5c6.2 0 11.5-2 15.3-5.6l-7.6-5.9c-2 1.4-4.7 2.4-7.7 2.4-6.4 0-11.7-4.2-13.6-10.2l-7.8 6.1C6.5 42.1 14.6 47.5 24 47.5z"/></svg>
    Entrar com Google
  </button>
  <div class="erro" id="gateErro" hidden></div>
</div></div>

<script>
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const KEY='brigadeiraria.dados.v1';
const CFGKEY='brigadeiraria.cfg.v1';
const BRL=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const BRL4=n=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:4,maximumFractionDigits:4});
const PCT=n=>((Number(n)||0)*100).toFixed(1).replace('.',',')+'%';
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}
function openDlg(html){$('#dlgBody').innerHTML=html;$('#dlg').showModal();}
function closeDlg(){$('#dlg').close();}

/* =========================================================
   CONFIGURAÇÃO — edite estas duas linhas
   1) Client ID do OAuth criado no Google Cloud (veja o README)
   2) E-mails Google que podem usar o app
   ========================================================= */
const CLIENT_ID = '767955501543-aakf19stvvftp9idunq8a0blotavdq8l.apps.googleusercontent.com';
const EMAILS_AUTORIZADOS = [
  'siomaracampos.brigs@gmail.com',
  'sims.creiando@gmail.com',
];
/* ========================================================= */

const PASTA='Brigadeiraria App', ARQUIVO='dados.json', PASTA_HIST='Histórico', MAX_VERSOES=50;
const SCOPES='https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
const VAZIO=()=>({versao:2,config:{taxaDelivery:.305,taxaCartao:.04,custosIndiretos:.15,markupPadrao:2.85,metaMensal:0,
  fatorTamanho:1.0625,fatorFestas:.8,fatorRevenda:.63462,fatorDelivery:1.25482,acrescimoCento:8},
  insumos:[],receitas:[],produtos:[],pcento:[],despesas:[],estoque:[]});
const SECOES=['insumos','receitas','produtos','pcento','despesas','estoque'];

/* ---------- ordenação genérica de tabelas ---------- */
const ORD={};
function ordenarPor(tab,k){const o=ORD[tab];ORD[tab]=(o&&o.c===k)?{c:k,a:!o.a}:{c:k,a:true};go(atual);}
function cabecalho(tab,cols){const o=ORD[tab];
  return `<tr>${cols.map((c,k)=>`<th class="${c.num?'num':''}" onclick="ordenarPor('${tab}',${k})">${c.t}${o&&o.c===k?(o.a?' ▲':' ▼'):''}</th>`).join('')}</tr>`;}
function ordenaLinhas(tab,rows){const o=ORD[tab];if(!o)return rows;
  const s=rows.slice();
  s.sort((x,y)=>{const A=x[o.c]?.v,B=y[o.c]?.v;
    let r;
    if(typeof A==='number'&&typeof B==='number') r=A-B;
    else r=String(A??'').localeCompare(String(B??''),'pt-BR',{numeric:true,sensitivity:'base'});
    return o.a?r:-r;});
  return s;}
function corpo(tab,rows){return ordenaLinhas(tab,rows).map(r=>`<tr>${r.map(c=>`<td class="${c.num?'num':''}">${c.h!==undefined?c.h:esc(c.v)}</td>`).join('')}</tr>`).join('');}
function tabela(tab,cols,rows,vazio='Nada encontrado.'){
  if(!rows.length) return `<p class="muted">${vazio}</p>`;
  return `<div class="wrap"><table><thead>${cabecalho(tab,cols)}</thead><tbody>${corpo(tab,rows)}</tbody></table></div>`;}

let DB=null, TOKEN=null, USER=null, tokenClient=null;
let IDS={pasta:null,arquivo:null,hist:null}, REV=null, dirty=false, timerSalvar=null, salvando=false;

/* ---------- login com Google ---------- */
function gateErro(msg){const e=$('#gateErro');e.hidden=!msg;e.textContent=msg||'';}
function esperaGIS(){return new Promise(res=>{const t=setInterval(()=>{if(window.google&&google.accounts&&google.accounts.oauth2){clearInterval(t);res()}},120)})}

async function iniciarAuth(){
  if(CLIENT_ID.startsWith('COLE_AQUI')){ gateErro('Falta configurar o Client ID do Google no topo do index.html. O passo a passo está no README.'); return; }
  await esperaGIS();
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:SCOPES,
    callback:async resp=>{
      if(resp.error){ gateErro('Não foi possível entrar: '+resp.error); return; }
      TOKEN=resp.access_token;
      try{ await depoisDoLogin(); }catch(e){ gateErro(e.message); }
    }
  });
  tokenClient.requestAccessToken({prompt:''});   // tenta entrar em silêncio
}
function entrar(){ gateErro(''); if(tokenClient) tokenClient.requestAccessToken({prompt:'consent'}); else iniciarAuth(); }
function renovarToken(){return new Promise((res,rej)=>{
  const cb=tokenClient.callback;
  tokenClient.callback=r=>{tokenClient.callback=cb; if(r.error){rej(new Error(r.error))}else{TOKEN=r.access_token;res()}};
  tokenClient.requestAccessToken({prompt:''});
})}
function sair(){
  if(TOKEN&&window.google) google.accounts.oauth2.revoke(TOKEN,()=>{});
  TOKEN=null;USER=null;location.reload();
}

async function depoisDoLogin(){
  const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+TOKEN}});
  if(!r.ok) throw new Error('Não consegui confirmar sua conta Google.');
  USER=await r.json();
  const lista=EMAILS_AUTORIZADOS.map(e=>e.toLowerCase().trim()).filter(Boolean);
  if(lista.length && !lista.includes((USER.email||'').toLowerCase())){
    TOKEN=null; throw new Error('A conta '+USER.email+' não está autorizada a usar este painel.');
  }
  $('#userChip').textContent=USER.email;
  $('#gate').style.display='none';
  await boot();
}

/* ---------- Google Drive ---------- */
async function drive(url,opt={},retry=true){
  const o=Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+TOKEN},opt.headers||{})});
  const r=await fetch(url,o);
  if(r.status===401&&retry){ await renovarToken(); return drive(url,opt,false); }
  if(!r.ok) throw new Error('Drive '+r.status+': '+(await r.text()).slice(0,180));
  return r;
}
const q=s=>encodeURIComponent(s);
async function achar(query,fields='files(id,name,createdTime,appProperties)'){
  const r=await drive(`https://www.googleapis.com/drive/v3/files?q=${q(query)}&fields=${q(fields)}&orderBy=createdTime desc&pageSize=200&spaces=drive`);
  return (await r.json()).files||[];
}
async function criar(meta){
  const r=await drive('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(meta)});
  return (await r.json()).id;
}
async function pasta(nome,paiId){
  const filtro=`mimeType='application/vnd.google-apps.folder' and name='${nome.replace(/'/g,"\\'")}' and trashed=false`+(paiId?` and '${paiId}' in parents`:'');
  const f=await achar(filtro);
  if(f[0]) return f[0].id;
  return criar({name:nome,mimeType:'application/vnd.google-apps.folder',parents:paiId?[paiId]:undefined});
}
async function subir(conteudo,meta,fileId){
  const limite='-------brig'+Date.now();
  const corpo='--'+limite+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
    '\r\n--'+limite+'\r\nContent-Type: application/json\r\n\r\n'+conteudo+'\r\n--'+limite+'--';
  const url=fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart&fields=id,headRevisionId`
    : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,headRevisionId';
  const r=await drive(url,{method:fileId?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+limite},body:corpo});
  return r.json();
}
async function lerArquivo(id){
  const r=await drive(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  return r.json();
}

/* ---------- carga ---------- */
async function boot(){
  estado('wait','conectando ao Drive…');
  IDS.pasta=await pasta(PASTA,null);
  IDS.hist=await pasta(PASTA_HIST,IDS.pasta);
  const arq=await achar(`name='${ARQUIVO}' and '${IDS.pasta}' in parents and trashed=false`,'files(id,headRevisionId)');
  if(arq[0]){
    IDS.arquivo=arq[0].id; REV=arq[0].headRevisionId;
    DB=await lerArquivo(IDS.arquivo);
    okBoot('Google Drive · '+PASTA);
  }else{
    let inicial=null;
    try{ inicial=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
    if(!inicial){ try{ inicial=await (await fetch('dados.json',{cache:'no-store'})).json(); }catch(e){} }
    DB=inicial||VAZIO();
    const j=await subir(JSON.stringify(DB,null,1),{name:ARQUIVO,parents:[IDS.pasta],mimeType:'application/json'});
    IDS.arquivo=j.id; REV=j.headRevisionId;
    okBoot('Drive · arquivo criado agora');
  }
  estado('ok','salvo');
}
function okBoot(origem){
  DB.config=Object.assign(VAZIO().config,DB.config||{});
  SECOES.forEach(k=>DB[k]=DB[k]||[]);
  DB.versao=2;
  localStorage.setItem(KEY,JSON.stringify(DB));
  $('#hdrInfo').textContent=origem;
  renderTabs(); go(location.hash.slice(1)||'insumos');
}

/* ---------- salvamento ---------- */
function estado(cls,txt){const s=$('#sync');s.hidden=false;s.className='sync noprint'+(cls==='ok'?'':' '+cls);$('#syncTxt').textContent=txt;}
function save(){
  localStorage.setItem(KEY,JSON.stringify(DB));
  dirty=true; estado('wait','alterações não salvas');
  clearTimeout(timerSalvar); timerSalvar=setTimeout(()=>salvarDrive().catch(()=>{}),3000);
}
function salvarAgora(){ clearTimeout(timerSalvar); salvarDrive(prompt('Comentário desta versão (opcional):')||'').then(()=>toast('Salvo no Drive')).catch(e=>toast('Erro: '+e.message)); }

async function salvarDrive(comentario=''){
  if(!IDS.arquivo||salvando) return;
  salvando=true; estado('wait','salvando…');
  try{
    const meta=await (await drive(`https://www.googleapis.com/drive/v3/files/${IDS.arquivo}?fields=headRevisionId,lastModifyingUser(emailAddress)`)).json();
    if(REV&&meta.headRevisionId&&meta.headRevisionId!==REV){
      const quem=meta.lastModifyingUser?.emailAddress||'outra pessoa';
      if(!confirm(`Os dados foram alterados por ${quem} enquanto você editava.\n\nOK = sobrescrever com a sua versão\nCancelar = recarregar a versão do Drive`)){
        salvando=false; location.reload(); return;
      }
    }
    const j=await subir(JSON.stringify(DB,null,1),{mimeType:'application/json'},IDS.arquivo);
    REV=j.headRevisionId; dirty=false;
    await snapshot(comentario);
    estado('ok','salvo '+new Date().toLocaleTimeString('pt-BR').slice(0,5));
  }catch(e){
    estado('err','sem conexão — salvo só neste aparelho');
    throw e;
  }finally{ salvando=false; }
}
async function snapshot(comentario){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const nome=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}.json`;
  await subir(JSON.stringify(DB),{name:nome,parents:[IDS.hist],mimeType:'application/json',
    appProperties:{autor:USER?.email||'',comentario:(comentario||'').slice(0,120)}});
  const vs=await achar(`'${IDS.hist}' in parents and trashed=false`);
  for(const v of vs.slice(MAX_VERSOES)) drive(`https://www.googleapis.com/drive/v3/files/${v.id}`,{method:'DELETE'}).catch(()=>{});
}
window.addEventListener('online',()=>{ if(dirty) salvarDrive().catch(()=>{}); });
window.addEventListener('beforeunload',e=>{ if(dirty){e.preventDefault();e.returnValue='';} });

/* ---------- histórico de versões ---------- */
let versoes=[];
async function viewHistorico(){
  $('#view').innerHTML=`<div class="card"><h2>Histórico de versões</h2><p class="sub">Carregando do Drive…</p></div>`;
  try{ versoes=await achar(`'${IDS.hist}' in parents and trashed=false`); }catch(e){ versoes=[]; }
  $('#view').innerHTML=`
  <div class="card">
    <h2>Histórico de versões</h2>

/* ---------- cálculos ---------- */
const insumoPorNome=n=>DB.insumos.find(i=>i.nome.toLowerCase().trim()===String(n||'').toLowerCase().trim());
function custoInsumo(i){
  if(i.quantidade&&i.valor!=null) return (i.valor/i.quantidade)*(1+(i.perda||0));
  return i.custoUnit||0;
}
function custoItemReceita(it){
  const ins=insumoPorNome(it.item);
  if(ins) return custoInsumo(ins)*(it.quantidade||0);
  return it.custo||0;
}
function custoReceita(r){return (r.itens||[]).reduce((s,it)=>s+custoItemReceita(it),0);}
function pesoReceita(r){return (r.itens||[]).reduce((s,it)=>s+(Number(it.quantidade)||0),0);}
function pesoFinal(r){const p=pesoReceita(r);const a=Number(r.pesoApos)||0;return (a>0&&a<=p)?a:p*(1-(r.perdaCoccao||0));}
function precoKg(r){const pf=pesoFinal(r);return pf?custoReceita(r)/pf*1000:0;}
function precificar(p){
  const c=DB.config, base=Number(p.custoUnit)||0;
  const cart=1+(c.taxaCartao||0);
  const t16=base*(1+(c.custosIndiretos||0));
  const total=t16*(c.fatorTamanho||1.0625);      // custo com indiretos — tamanho 18g (17g real)
  const mk=Number(p.markup)||c.markupPadrao||2.85;
  const a16=t16*mk*cart;
  const avulso=total*mk*cart;
  return {total, semCartao:total*mk, avulso,
          festas:avulso*(c.fatorFestas||0.8),
          revenda:a16*(c.fatorRevenda||0.63462),
          delivery:a16*(c.fatorDelivery||1.25482),
          lucro:avulso-total-(avulso*(c.taxaCartao||0))};
}
const despesaTotal=()=>DB.despesas.reduce((s,d)=>s+(Number(d.valor)||0),0);

/* ---------- P. CENTO (precificação comercial dos centos) ---------- */
let fCen='';
const produtoPorSabor=s=>DB.produtos.find(p=>p.nome.toLowerCase().trim()===String(s||'').toLowerCase().trim());
function custoCento(c){
  const p=produtoPorSabor(c.sabor), auto=p?precificar(p).festas*100:0;
  return auto>0?auto:(Number(c.custoCento)||0);
}
function linhaCento(c){
  const custo=custoCento(c);
  const acres=Number(c.acrescimo)??DB.config.acrescimoCento??8;
  const minimo=custo?custo+(Number.isFinite(acres)?acres:8):0;
  const preco=Number(c.precoCento)||0;
  return {custo,minimo,preco,meio:preco/2,
          desconto:(preco&&minimo)?(preco-minimo)/preco:null,
          difR:preco-(Number(c.valorAntigo)||0),
          difP:(Number(c.valorAntigo)||0)?(preco-c.valorAntigo)/c.valorAntigo:0};
}
function viewPcento(){
  const lista=DB.pcento.filter(c=>c.sabor.toLowerCase().includes(fCen.toLowerCase()));
  const cols=[{t:'Sabor'},{t:'Custo do cento',num:1},{t:'Acréscimo',num:1},{t:'Custo mínimo',num:1},{t:'Valor antigo',num:1},{t:'Preço do cento',num:1},{t:'Meio cento',num:1},{t:'Máx. desconto',num:1},{t:'Dif. cardápio',num:1},{t:''}];
  const rows=lista.map(c=>{const j=DB.pcento.indexOf(c),r=linhaCento(c),
    p=produtoPorSabor(c.sabor), auto=p?precificar(p).festas*100:0;return [
    {v:c.sabor,h:`<strong>${esc(c.sabor)}</strong>${r.custo?'':' <span class="pill a">custo em branco</span>'}`},
    {v:r.custo,h:auto>0?BRL(r.custo)+' <span class="muted" style="font-size:11px">auto</span>'
       :`<input type="number" step="any" value="${Number(c.custoCento)||0}" style="width:100px;text-align:right" onchange="DB.pcento[${j}].custoCento=+this.value;save();viewPcento()">`,num:1},
    {v:Number(c.acrescimo)||0,h:`<input type="number" step="any" value="${Number(c.acrescimo)||0}" style="width:80px;text-align:right" onchange="DB.pcento[${j}].acrescimo=+this.value;save();viewPcento()">`,num:1},
    {v:r.minimo,h:r.minimo?BRL(r.minimo):'—',num:1},
    {v:Number(c.valorAntigo)||0,h:`<input type="number" step="any" value="${Number(c.valorAntigo)||0}" style="width:90px;text-align:right" onchange="DB.pcento[${j}].valorAntigo=+this.value;save();viewPcento()">`,num:1},
    {v:r.preco,h:`<input type="number" step="any" value="${r.preco}" style="width:100px;text-align:right" onchange="DB.pcento[${j}].precoCento=+this.value;save();viewPcento()">`,num:1},
    {v:r.meio,h:`<strong>${BRL(r.meio)}</strong>`,num:1},
    {v:r.desconto??-1,h:r.desconto===null?'<span class="muted">—</span>':`<span class="pill ${r.desconto>=.15?'v':'a'}">${PCT(r.desconto)}</span>`,num:1},
    {v:r.difR,h:`${BRL(r.difR)}${(Number(c.valorAntigo)||0)?' · '+PCT(r.difP):''}`,num:1},
    {v:'',h:`<button class="btn ghost" onclick="DB.pcento.splice(${j},1);save();viewPcento()">✕</button>`,num:1}];});
  const comPreco=DB.pcento.filter(c=>Number(c.precoCento)>0);
  const ticket=comPreco.length?comPreco.reduce((s,c)=>s+Number(c.precoCento),0)/comPreco.length:0;
  $('#view').innerHTML=`
  <div class="card">
    <h2>P. Cento — precificação comercial</h2>
    <p class="sub">Custo do cento = custo de festas × 100, puxado da Precificação. Onde a planilha ainda não tem custo, dá para digitar o valor na mão. O custo mínimo é o custo do cento mais o acréscimo (padrão R$ ${(DB.config.acrescimoCento||8)}), e o máximo de desconto mostra até onde dá para negociar sem passar do mínimo.</p>
    <div class="grid g3" style="margin-bottom:14px">
      <div class="kpi"><div class="lab">Sabores</div><div class="val">${DB.pcento.length}</div></div>
      <div class="kpi"><div class="lab">Com preço definido</div><div class="val">${comPreco.length}</div></div>
      <div class="kpi"><div class="lab">Preço médio do cento</div><div class="val">${BRL(ticket)}</div></div>
    </div>
    <div class="toolbar">
      <input class="grow" placeholder="Buscar sabor…" value="${esc(fCen)}" oninput="fCen=this.value;viewPcento();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
      <button class="btn" onclick="addCento()">+ Sabor</button>
    </div>
    ${tabela('pcento',cols,rows,'Nenhum sabor encontrado.')}

function baixar(nome,conteudo,tipo){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));a.download=nome;a.click();
}
function exportJSON(){baixar('dados.json',JSON.stringify(DB,null,1),'application/json');}
function importJSON(el){
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{DB=JSON.parse(r.result);save();toast('Importado');go(atual)}catch(e){toast('JSON inválido')}};
  r.readAsText(f);
}
function exportXLSX(){
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.insumos.map(i=>({'Matéria-prima':i.nome,'Unidade':i.unidade,'Quantidade':i.quantidade,'Valor total':i.valor,'Fator perda':i.perda,'Custo unitário':custoInsumo(i)}))),'Insumos');
  const rec=[];DB.receitas.forEach(r=>r.itens.forEach(it=>rec.push({Receita:r.nome,Item:it.item,Unidade:it.unidade,Quantidade:it.quantidade,'Custo':custoItemReceita(it),'% Perda':r.perdaCoccao,'Custo receita':custoReceita(r),'Custo/kg':precoKg(r)})));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rec),'Receitas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.produtos.map(p=>{const r=precificar(p);return{Linha:p.linha,Produto:p.nome,'Custo unitário':p.custoUnit,'Custo c/ indiretos':r.total,Markup:p.markup,'Avulso':r.avulso,'Festas':r.festas,'Revenda':r.revenda,'Delivery':r.delivery,'Lucro':r.lucro}})),'Precificação');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.despesas),'Despesas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.pcento.map(c=>{const r=linhaCento(c);return{Sabor:c.sabor,'Custo do cento':r.custo,'Acréscimo':c.acrescimo,'Custo mínimo':r.minimo,'Valor antigo':c.valorAntigo,'Preço do cento':r.preco,'Meio cento':r.meio,'Máx. desconto':r.desconto}})),'P. Cento');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.estoque.map(e=>({Nicho:e.local,Item:e.item,Acabando:e.acabando?'sim':''}))),'Estoque');
  XLSX.writeFile(wb,'brigadeiraria.xlsx');
}

let promptInstalar=null;
const semSW=()=>{
  const h=location.hostname;
  return location.protocol==='file:'||window.top!==window.self||
    h==='localhost'||h==='127.0.0.1'||
    h.startsWith('id-preview--')||h.startsWith('preview--')||
    /(^|\.)lovableproject\.com$/.test(h)||/(^|\.)lovableproject-dev\.com$/.test(h)||
    /(^|\.)beta\.lovable\.dev$/.test(h)||/(^|\.)lovable\.app$/.test(h)||
    new URLSearchParams(location.search).has('sw-off');
};
if('serviceWorker' in navigator){
  if(semSW()){
    navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{
      if((r.active?.scriptURL||'').includes('sw.js')) r.unregister();
    })).catch(()=>{});
  }else{
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
}
